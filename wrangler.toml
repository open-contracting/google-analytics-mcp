name = "google-analytics-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Import the tool descriptions as strings.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
ALLOWED_EMAIL_DOMAIN = "open-contracting.org"

# Created with `pnpm exec wrangler kv namespace create OAUTH_KV`.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "741d972110cd47848cfad5999ce7c34c"

[observability.logs]
enabled = true
